syntax = "proto3";
package hybrid_embedder.v1;

import "third_party/protovalidate/buf/validate/validate.proto";


service HybridEmbedderService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc DenseEmbed(DenseEmbedRequest) returns (DenseEmbedResponse);
  rpc DenseEmbedBatch(DenseEmbedBatchRequest) returns (DenseEmbedBatchResponse);
  rpc SparseEmbed(SparseEmbedRequest) returns (SparseEmbedResponse);
  rpc SparseEmbedBatch(SparseEmbedBatchRequest) returns (SparseEmbedBatchResponse);
}


message HealthRequest {}


message HealthResponse {
  string status            = 1 [(buf.validate.field).string = {min_len: 0, max_len: 32}];
  string model_id          = 2 [(buf.validate.field).string = {min_len: 0, max_len: 256}];
  int32  dim               = 3 [(buf.validate.field).int32  = {gte: -1, lte: 4096}];
  int32  sparse_vocab_size = 4 [(buf.validate.field).int32  = {gte: -1}];
}


message DenseEmbedRequest {
  string text = 1 [(buf.validate.field).string = {min_len: 10, pattern: ".*\\S.*"}];
}


message DenseEmbedResponse {
  repeated float vector = 1 [(buf.validate.field).repeated = {max_items: 4096}];
  bool          success = 2;
  string        error   = 3 [(buf.validate.field).string = {max_len: 2048}];
}


message DenseEmbedBatchRequest {
  repeated string texts = 1 [(buf.validate.field).repeated = {
    min_items: 1,
    max_items: 256,
    items: { string: { min_len: 10, pattern: ".*\\S.*" } }
  }];
}


message DenseEmbedBatchResponse {
  repeated DenseEmbedResponse items = 1 [(buf.validate.field).repeated = {min_items: 1, max_items: 256}];
}


message SparseEmbedRequest {
  string text = 1 [(buf.validate.field).string = {min_len: 10, pattern: ".*\\S.*"}];
}


message SparseEmbedResponse {
  repeated uint32 indices = 1 [(buf.validate.field).repeated = {min_items: 1}];
  repeated float  values  = 2 [(buf.validate.field).repeated = {min_items: 1}];
  bool            success = 3;
  string          error   = 4 [(buf.validate.field).string = {max_len: 2048}];
}


message SparseEmbedBatchRequest {
  repeated string texts = 1 [(buf.validate.field).repeated = {
    min_items: 1,
    max_items: 256,
    items: { string: { min_len: 10, max_len: 8192, pattern: ".*\\S.*" } }
  }];
}


message SparseEmbedBatchResponse {
  repeated SparseEmbedResponse items = 1 [(buf.validate.field).repeated = {min_items: 1, max_items: 256}];
}

