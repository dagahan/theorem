syntax = "proto3";

package system_prompt_builder.v1;

import "third_party/protovalidate/buf/validate/validate.proto";


service SystemPromptBuilderService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc BuildSystemPrompt(BuildSystemPromptRequest) returns (BuildSystemPromptResponse);
}


message HealthRequest {}


message HealthResponse {
  string status = 1 [(buf.validate.field).string = {min_len: 0, max_len: 32}];
  string policy_builder_status = 2 [(buf.validate.field).string = {min_len: 0, max_len: 32}];
}


message BuildSystemPromptRequest {}


message BuildSystemPromptResponse {
  string system_prompt = 1 [(buf.validate.field).string = {min_len: 1, max_len: 13072}];
  bool success = 2;
  string error = 3 [(buf.validate.field).string = {max_len: 2048}];
}


