syntax = "proto3";
package question_builder.v1;

import "third_party/protovalidate/buf/validate/validate.proto";


service QuestionBuilderService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc ProcessQuestion(ProcessQuestionRequest) returns (ProcessQuestionResponse);
}


message HealthRequest {}


message HealthResponse {
  string status = 1 [(buf.validate.field).string = {min_len: 0, max_len: 32}];
  string llm_status = 2 [(buf.validate.field).string = {min_len: 0, max_len: 32}];
}


message ProcessQuestionRequest {
  string raw_text = 1 [(buf.validate.field).string = {min_len: 1, max_len: 8192, pattern: ".*\\S.*"}];
}


message ProcessQuestionResponse {
  string original_question = 1 [(buf.validate.field).string = {min_len: 1, max_len: 8192}];
  string expanded_question = 2 [(buf.validate.field).string = {min_len: 1, max_len: 8192}];
  repeated string expanded_question_semantic_parts = 3;
  bool success = 4;
  string error = 5 [(buf.validate.field).string = {max_len: 2048}];
}



