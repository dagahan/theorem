syntax = "proto3";
package llm_gateway.v1;

option go_package = "llm_gateway/v1";

import "third_party/protovalidate/buf/validate/validate.proto";


service LLMGatewayService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Question(QuestionRequest) returns (QuestionResponse);
}


message HealthRequest {}


message ComponentStatus {
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  string status = 2 [(buf.validate.field).string = {min_len: 0, max_len: 32}];
  string details = 3 [(buf.validate.field).string = {max_len: 256}];
}


message HealthResponse {
  string status = 1 [(buf.validate.field).string = {min_len: 0, max_len: 32}];
  ComponentStatus agent_controller = 2;
  repeated ComponentStatus downstream_components = 3;
}


message QuestionRequest {
  string raw_text = 1 [(buf.validate.field).string = {min_len: 1, max_len: 8192, pattern: ".*\\S.*"}];
  bool stream = 2;
  string agent_name = 3 [(buf.validate.field).string = {min_len: 1, max_len: 128, pattern: ".*\\S.*"}];
}


message QuestionResponse {
  string answer = 1;
  bool success = 2;
  string error = 3;
}


