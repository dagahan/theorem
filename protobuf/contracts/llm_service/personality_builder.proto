syntax = "proto3";

package personality_builder.v1;

import "third_party/protovalidate/buf/validate/validate.proto";


service PersonalityBuilderService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc BuildPersonality(BuildPersonalityRequest) returns (BuildPersonalityResponse);
}


message HealthRequest {}


message HealthResponse {
  string status = 1 [(buf.validate.field).string = {min_len: 0, max_len: 32}];
  string policy_builder_status = 2 [(buf.validate.field).string = {min_len: 0, max_len: 32}];
}


message BuildPersonalityRequest {
  repeated string persona_names = 1 [(buf.validate.field).repeated.min_items = 1];
  string agent_name = 2 [(buf.validate.field).string = {min_len: 0, max_len: 128}];
}


message ResponseSchema {
  string type = 1 [(buf.validate.field).string = {min_len: 1, max_len: 32}];
  map<string, string> properties = 2;
  repeated string required = 3;
  string title = 4 [(buf.validate.field).string = {max_len: 64}];
}


message Personality {
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  string system_prompt = 2 [(buf.validate.field).string = {min_len: 1, max_len: 13072}];
  ResponseSchema response_schema = 3;
}


message BuildPersonalityResponse {
  repeated Personality personalities = 1 [(buf.validate.field).repeated.min_items = 1];
  bool success = 2;
  string error = 3 [(buf.validate.field).string = {max_len: 2048}];
}


