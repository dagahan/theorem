PYTHONUNBUFFERED=1                 # flush logs immediately; avoids lost logs on crashes
PYTHONIOENCODING=UTF-8             # consistent I/O encoding
PYTHONDONTWRITEBYTECODE=1          # avoid *.pyc writes in containers
PYTHONHASHSEED=0                   # reproducible hashing (helps caches & tests)
PYTHONASYNCIODEBUG=0               # make sure asyncio debug is OFF in prod


PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=cpp
# Uses the C++ protobuf runtime if present (it is in official wheels).
# Expect markedly faster (de)serialization and lower CPU.


OMP_NUM_THREADS=1
MKL_NUM_THREADS=1
OPENBLAS_NUM_THREADS=1
BLIS_NUM_THREADS=1
NUMEXPR_NUM_THREADS=1
OMP_WAIT_POLICY=PASSIVE            # reduce CPU spin when idle
# Rationale: your inference is GPU-bound; CPU-side tokenization/pre/post are light.
# This stops NumPy/BLAS from flooding the box with threads and fighting the event loop.


TOKENIZERS_PARALLELISM=false       # avoid tokenizer thread storms + warning spam
HF_HOME=/data/hf-cache             # put all model/dataset caches on your fast volume
TRANSFORMERS_CACHE=/data/hf-cache
HF_DATASETS_CACHE=/data/hf-cache
HF_HUB_DISABLE_TELEMETRY=1         # less noise
HF_HUB_ENABLE_HF_TRANSFER=1        # faster downloads w/ libhf_transfer if available


GRPC_POLL_STRATEGY=epoll1          # best on Linux
GRPC_DNS_RESOLVER=ares             # robust DNS
GRPC_GOOGLE_NEW_CHANNEL_CONNECTIVITY_WATCHER=1  # better channel state tracking
# (Keep keepalive settings in code/options; envs for them are inconsistent across versions.)



# ubuntu env settings


TZ=UTC \
    LANG=C.UTF-8 \
    LC_ALL=C.UTF-8 \
    LANGUAGE=C.UTF-8

DEBIAN_FRONTEND=noninteractive \
    DEBCONF_NONINTERACTIVE_SEEN=true \
    DEBIAN_PRIORITY=critical \
    APT_LISTCHANGES_FRONTEND=none

NEEDRESTART_MODE=a

UCF_FORCE_CONFFNEW=1

DPKG_COLORS=never

RES_OPTIONS="timeout:1 attempts:3 rotate"

MALLOC_ARENA_MAX=2                 # limit glibc arenas -> lower RSS, fewer leaks under load

