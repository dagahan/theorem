  vllm_math:
    build:
      context: ./vllm_math
      dockerfile: dockerfile
    image: vllm_math-${COMPOSE_PROJECT_NAME}
    container_name: vllm_math-${COMPOSE_PROJECT_NAME}
    env_file: 
      - .env
      - ./vllm_math/.conf
    environment:
      RUNNING_INSIDE_DOCKER: 1
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN}
    ports:
      - "${VLLM_MATH_PORT:-8000}:8000"
    volumes:
      - vllm_math_data:/data/hf-cache   
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - llm_network
    restart: ${DOCKER_CONTAINERS_RESTART}
    develop:
      watch:
        - action: rebuild
          path: ./vllm_math


networks:
  llm_network:
    driver: bridge
    name: llm_network


volumes:
  vllm_math_data:
    driver: local

  qdrant_data:
    driver: local

