name: llm-service


services:
  qdrant:
    build:
      context: ./qdrant
      dockerfile: dockerfile
    image: qdrant-${COMPOSE_PROJECT_NAME}
    container_name: qdrant-${COMPOSE_PROJECT_NAME}
    env_file: 
      - .env
      - ./qdrant/.conf
    environment:
      RUNNING_INSIDE_DOCKER: 1
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    ports:
      - "${QDRANT_PORT}:${QDRANT_PORT}"
    volumes:
      - ./qdrant-data:/qdrant/storage
    networks:
      - llm_network
    restart: ${DOCKER_CONTAINERS_RESTART}
    develop:
      watch:
        - action: rebuild
          path: ./qdrant


  embedder:
    build:
      context: ./embedder
      dockerfile: dockerfile
    image: embedder-${COMPOSE_PROJECT_NAME}
    container_name: embedder-${COMPOSE_PROJECT_NAME}
    env_file: 
      - .env
      - ./embedder/.conf
    environment:
      RUNNING_INSIDE_DOCKER: 1
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    ports:
      - "${EMBEDDER_PORT}:${EMBEDDER_PORT}"
    networks:
      - llm_network
    restart: ${DOCKER_CONTAINERS_RESTART}
    develop:
      watch:
        - action: rebuild
          path: ./embedder


