syntax = "proto3";

package rag;

option go_package = "rag-service/proto/rag";

service RAGService {
  rpc SearchDocuments(SearchRequest) returns (SearchResponse);
  rpc HealthCheck(HealthRequest) returns (HealthResponse);
}

message SearchRequest {
  string query = 1;
  int32 top_k = 2;
}

message SearchResponse {
  repeated DocumentResult documents = 1;
  bool success = 2;
  string error = 3;
}

message DocumentResult {
  string id = 1;
  string text = 2;
  float score = 3;
}

message HealthRequest {}

message HealthResponse {
  bool healthy = 1;
  string message = 2;
}