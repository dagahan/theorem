version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/yourorg/theorem/llm_gateway/pkg/gen

plugins:
  # --- Go ---
  - remote: buf.build/protocolbuffers/go:v1.35.1
    out: ../LLM_SERVICE/llm_gateway/pkg/gen
    opt: paths=source_relative

  - remote: buf.build/grpc/go:v1.5.1
    out: ../LLM_SERVICE/llm_gateway/pkg/gen
    opt: paths=source_relative

  # --- Python ---
  - remote: buf.build/protocolbuffers/python:v28.3
    out: ../LLM_SERVICE/embedder_python/src/eyemath_proto

  - remote: buf.build/grpc/python:v1.62.2
    out: ../LLM_SERVICE/embedder_python/src/eyemath_proto


    