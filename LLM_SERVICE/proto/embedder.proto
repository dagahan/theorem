syntax = "proto3";

package embedder;

option go_package = "rag-service/proto/embedder";

service EmbedderService {
  rpc EmbedText(EmbedTextRequest) returns (EmbedTextResponse);
  rpc EmbedBatch(EmbedBatchRequest) returns (EmbedBatchResponse);
}

message EmbedTextRequest {
  string text = 1;
}

message EmbedTextResponse {
  repeated float embedding = 1;
  bool success = 2;
  string error = 3;
}

message EmbedBatchRequest {
  repeated string texts = 1;
}

message EmbedBatchResponse {
  repeated EmbeddingResult results = 1;
  bool success = 2;
  string error = 3;
}

message EmbeddingResult {
  repeated float embedding = 1;
  bool success = 2;
  string error = 3;
}

