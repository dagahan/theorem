# ==== Хранилища кешей (персистентные тома) ====
ENV HF_HOME=/data/hf-cache \
    TRANSFORMERS_CACHE=/data/hf-cache/transformers \
    HUGGINGFACE_HUB_CACHE=/data/hf-cache/hub \
    HF_HUB_CACHE=/data/hf-cache/hub \
    TRITON_CACHE_DIR=/data/triton-cache \
    TORCHINDUCTOR_CACHE_DIR=/data/torch-inductor-cache \
    XDG_CACHE_HOME=/data/.cache
# (создать каталоги и отдать пользователю)
RUN mkdir -p /data/hf-cache/transformers /data/hf-cache/hub /data/triton-cache /data/torch-inductor-cache /data/.cache \
 && chown -R appuser:appuser /data

# ==== Hugging Face / сеть ====
ENV HF_HUB_ENABLE_HF_TRANSFER=1 \
    HF_HUB_DISABLE_TELEMETRY=1 \
    TOKENIZERS_PARALLELISM=false

# ==== Python поведение ====
ENV PYTHONUNBUFFERED=1 \
    PYTHONDONTWRITEBYTECODE=1

# ==== CUDA / PyTorch / Triton (одна GPU, меньше фрагментации памяти) ====
ENV OMP_NUM_THREADS=1 \
    MKL_NUM_THREADS=1 \
    NUMEXPR_NUM_THREADS=1 \
    CUDA_MODULE_LOADING=LAZY \
    CUDA_CACHE_MAXSIZE=2147483648 \
    PYTORCH_CUDA_ALLOC_CONF="max_split_size_mb:128,expandable_segments:True" \
    TORCH_NCCL_BLOCKING_WAIT=1 \
    NCCL_ASYNC_ERROR_HANDLING=1 \
    NCCL_P2P_DISABLE=1 \
    NCCL_IB_DISABLE=1 \
    NVIDIA_TF32_OVERRIDE=0

# ==== vLLM/UVicorn логирование (по вкусу) ====
ENV VLLM_LOGGING_LEVEL=INFO \
    UVLOOP_NO_DEBUG=1

# ==== malloc/glibc: меньше разрастания RSS в долгоживущем процессе ====
ENV MALLOC_ARENA_MAX=2


