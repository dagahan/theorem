[project]
name = "protobuf-generator"
version = "0.0.1"
description = "Protobuf stub generator for LLM_SERVICE microservices"
requires-python = ">=3.12"
dependencies = [
    "grpcio-tools>=1.75.0",
    "protobuf>=6.32.1",
    "protovalidate>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.12.12",
    "mypy>=1.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I", "W", "N", "ANN", "TCH"]
ignore = ["ANN401", "W293", "F403", "F405"]
unfixable = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
show_error_codes = true
pretty = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
no_implicit_optional = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.mypy-grpc_tools]
ignore_missing_imports = true
[tool.mypy-protobuf]
ignore_missing_imports = true
[tool.mypy-protovalidate]
ignore_missing_imports = true